name: Update Global Dividend Matrix Data
on:
  schedule:
    - cron: '0 5 * * 1-5' # Runs automatically Monday-Friday at 5:00 AM UTC
  workflow_dispatch: # Allows you to click the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Codebase
        uses: actions/checkout@v4

      - name: Initialize Python Core Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # FIX: Installs yfinance so the Python script has an open, unblocked data stream
      - name: Install Python Dependencies
        run: pip install yfinance

      - name: Run Telemetry Processing Script
        run: python update_data.py

      - name: Commit and Synchronize Top 20 Matrix Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add top20.json
          git commit -m "Auto-synchronized live matrix stream data [Skip CI]" || exit 0
          git push
