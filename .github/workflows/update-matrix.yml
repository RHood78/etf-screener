name: Update Global Dividend Matrix Data
on:
  schedule:
    - cron: '24 7 * * 1-5' # Runs automatically Monday-Friday at 7:24 AM UTC (Off-peak to avoid rate limits)
  workflow_dispatch: # Allows you to click the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Codebase
        uses: actions/checkout@v4

      - name: Initialize Python Core Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Installs all required computational and tracking dependencies 
      - name: Install Python Dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run Telemetry Processing Script
        run: python update_data.py

      - name: Commit and Synchronize Top 20 Matrix Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add top20.json
          git commit -m "Auto-synchronized live matrix stream data [Skip CI]" || exit 0
          git push
